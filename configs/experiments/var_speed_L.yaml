# BASE CONDITION (friction x0 diagnostic plant, paper gains, LASA/Sine, demo_mean start, seed 0).
# Extreme speeds and larger DS sizes: alpha in {1,2,4,8,16} x L in {0.10, 0.20, 0.30} m (baseline sweep values,
# LfD_baseline configs/dynamic_baseline.yaml sweeps.speed_factors / speed_L_extension_m). T_max = 10 s for
# ALL conditions (the ideal DS needs 5.9 s / alpha, independent of L), documented torque limits x1.
# Question: where does the torque limit bind first (joint, time)?
extends: picds.yaml
plant: {dof_frictionloss_scale: 0.0}
experiment: {name: var_speed_L, controllers: [servo, pic]}
conditions:
  - {label: a1_L0.1, set: {ds_speed_factor: 1.0, task.L_m: 0.1}}
  - {label: a2_L0.1, set: {ds_speed_factor: 2.0, task.L_m: 0.1}}
  - {label: a4_L0.1, set: {ds_speed_factor: 4.0, task.L_m: 0.1}}
  - {label: a8_L0.1, set: {ds_speed_factor: 8.0, task.L_m: 0.1}}
  - {label: a16_L0.1, set: {ds_speed_factor: 16.0, task.L_m: 0.1}}
  - {label: a1_L0.2, set: {ds_speed_factor: 1.0, task.L_m: 0.2}}
  - {label: a2_L0.2, set: {ds_speed_factor: 2.0, task.L_m: 0.2}}
  - {label: a4_L0.2, set: {ds_speed_factor: 4.0, task.L_m: 0.2}}
  - {label: a8_L0.2, set: {ds_speed_factor: 8.0, task.L_m: 0.2}}
  - {label: a16_L0.2, set: {ds_speed_factor: 16.0, task.L_m: 0.2}}
  - {label: a1_L0.3, set: {ds_speed_factor: 1.0, task.L_m: 0.3}}
  - {label: a2_L0.3, set: {ds_speed_factor: 2.0, task.L_m: 0.3}}
  - {label: a4_L0.3, set: {ds_speed_factor: 4.0, task.L_m: 0.3}}
  - {label: a8_L0.3, set: {ds_speed_factor: 8.0, task.L_m: 0.3}}
  - {label: a16_L0.3, set: {ds_speed_factor: 16.0, task.L_m: 0.3}}
