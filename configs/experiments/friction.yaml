# B. Friction. dof_frictionloss (Coulomb joint friction, nominal 1.137/0.763/0.44/0.248 Nm,
# 0.21 Nms/rad viscous damping stays nominal) scaled in memory: 0 = DIAGNOSTIC, 1 = nominal,
# 2 = increased.
extends: picds.yaml
experiment:
  name: friction
  description: Coulomb joint friction scale 0 / 1 / 2.
  controllers: [servo, pic]
conditions:
  - {label: fric0.0, set: {plant.dof_frictionloss_scale: 0.0}}
  - {label: fric1.0, set: {plant.dof_frictionloss_scale: 1.0}}
  - {label: fric2.0, set: {plant.dof_frictionloss_scale: 2.0}}
